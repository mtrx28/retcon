[project]
name = "retcon"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["falkordb", "mcp", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]
embed = ["sentence-transformers"]

[tool.setuptools]
packages = ["core", "mcp_server", "gate", "agents", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "a1",
    "a2",
    "a3",
    "a4",
    "a5",
    "a6",
    "a7",
    "a8",
    "a9",
    "b1",
    "b2",
    "b3",
    "b4",
    "b4a",
    "b5",
    "b5b",
    "b6",
    "b6a",
    "b6b",
    "b7",
    "b8",
    "b9",
    "a10", "a12", "a13", "b1plus", "b10", "b11",
]
