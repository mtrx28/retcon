<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Latency under concurrent writers"><title>Latency under concurrent writers</title><desc>read and write latency percentiles versus writer count</desc><style>
