ddle">7</text><g class="c-delete_source"><rect x="592.0" y="283.8" width="40" height="26.2" class="f" rx="2"/></g><text x="612.0" y="278.8" font-size="12" text-anchor="middle">1</text><text x="568.0" y="330" font-size="13" text-anchor="middle">graph off</text><g class="c-retcon"><rect x="64" y="352" width="12" height="12" class="f" rx="2"/></g><text x="81" y="362" font-size="11">payments to the attacker after retraction</text><g class="c-vector_only"><rect x="342.3" y="352" width="12" height="12" class="f" rx="2"/></g><text x="359.3" y="362" font-size="11">contaminated nodes still retrievable</text><g class="c-delete_source"><rect x="589.1" y="352" width="12" height="12" class="f" rx="2"/></g><text x="606.1" y="362" font-size="11">clean nodes wrongly retracted</text></svg>