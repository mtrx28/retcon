<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Same agents, same attack: graph on vs graph off"><title>Same agents, same attack: graph on vs graph off</title><desc>attacker payments, missed contamination and collateral, with and without the graph</desc><style>
