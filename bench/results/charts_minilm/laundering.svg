 @media (prefers-color-scheme:dark){.c-delete_source{--c:#9aa5b4}.c-vector_only{--c:#f0a050}.c-edge_invalidation{--c:#d878b4}.c-coarse_taint{--c:#5aa8dc}.c-retcon{--c:#35c79a}}
