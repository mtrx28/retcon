36.0" cy="62.2" r="3.5" class="f"/></g><g class="c-vector_only"><polyline points="64.0,75.1 232.0,74.2 400.0,73.4 568.0,71.8 736.0,69.2" class="s" stroke-width="2" stroke-dasharray="1 0"/><circle cx="64.0" cy="75.1" r="3.5" class="f"/><circle cx="232.0" cy="74.2" r="3.5" class="f"/><circle cx="400.0" cy="73.4" r="3.5" class="f"/><circle cx="568.0" cy="71.8" r="3.5" class="f"/><circle cx="736.0" cy="69.2" r="3.5" class="f"/></g><g class="c-edge_invalidation"><polyline points="64.0,84.1 232.0,82.9 400.0,81.8 568.0,79.8 736.0,76.3" class="s" stroke-width="2" stroke-dasharray="1 0"/><circle cx="64.0" cy="84.1" r="3.5" class="f"/><circle cx="232.0" cy="82.9" r="3.5" class="f"/><circle cx="400.0" cy="81.8" r="3.5" class="f"/><circle cx="568.0" cy="79.8" r="3.5" class="f"/><circle cx="736.0" cy="76.3" r="3.5" class="f"/></g><g class="c-coarse_taint"><polyline points="64.0,310.0 232.0,310.0 400.0,310.0 568.0,310.0 736.0,310.0" class="s" stroke-width="2" stroke-dasharray="1 0"/><circle cx="64.0" cy="310.0" r="3.5" class="f"/><circle cx="232.0" cy="310.0" r="3.5" class="f"/><circle cx="400.0" cy="310.0" r="3.5" class="f"/><circle cx="568.0" cy="310.0" r="3.5" class="f"/><circle cx="736.0" cy="310.0" r="3.5" class="f"/></g><g class="c-retcon"><polyline points="64.0,310.0 232.0,310.0 400.0,310.0 568.0,310.0 736.0,310.0" class="s" stroke-width="3"/><circle cx="64.0" cy="310.0" r="3.5" class="f"/><circle cx="232.0" cy="310.0" r="3.5" class="f"/><circle cx="400.0" cy="310.0" r="3.5" class="f"/><circle cx="568.0" cy="310.0" r="3.5" class="f"/><circle cx="736.0" cy="310.0" r="3.5" class="f"/></g><g class="c-delete_source"><rect x="64" y="352" width="12" height="12" class="f" rx="2"/></g><text x="81" y="362" font-size="12">delete source</text><g class="c-vector_only"><rect x="179" y="352" width="12" height="12" class="f" rx="2"/></g><text x="196" y="362" font-size="12">vector only</text><g class="c-edge_invalidation"><rect x="280" y="352" width="12" height="12" class="f" rx="2"/></g>