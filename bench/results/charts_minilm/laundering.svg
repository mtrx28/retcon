<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Laundering resistance: contamination left after retraction"><title>Laundering resistance: contamination left after retraction</title><desc>residual contamination versus number of restatement hops</desc><style>
 :root{--bg:#fff;--ink:#17202a;--muted:#5b6776;--grid:#e3e7ec}
 @media (prefers-color-scheme:dark){:root{--bg:#10161d;--ink:#e6ebf1;--muted:#9aa7b6;--grid:#252f3a}}
 text{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial,sans-serif;fill:var(--ink)}
 .m{fill:var(--muted)} .g{stroke:var(--grid)} .ax{stroke:var(--muted)}
 .c-delete_source{--c:#8a94a3}.c-vector_only{--c:#d9822b}.c-edge_invalidation{--c:#b4488d}.c-coarse_taint{--c:#2e7fb5}.c-retcon{--c:#0f8a62}
